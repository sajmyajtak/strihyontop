<!doctype html>
<!-- Výchozí kostra scény pro render_html.cjs. Všechno se počítá z času t ve window.seek(t),
     žádné CSS animace ani časovače, takže každý snímek jde vyrenderovat přesně a opakovaně.
     ?mrizka v URL zobrazí bezpečné zóny 9:16 (pravidlo A5). -->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; }
  #scena { position: relative; width: 100%; height: 100%; font-family: system-ui, sans-serif; color: #fff; }
  .prvek { position: absolute; will-change: transform, opacity, filter; }
  #mrizka { position: absolute; inset: 0; pointer-events: none; display: none;
    box-shadow: inset 0 250px 0 rgba(255,0,0,.25), inset 0 -400px 0 rgba(255,0,0,.25), inset -120px 0 0 rgba(255,0,0,.25); }
</style>
</head>
<body>
<div id="scena">
  <div class="prvek" id="titulek" style="left:0;right:0;top:45%;text-align:center;font-size:120px;font-weight:800">TITULEK</div>
  <div id="mrizka"></div>
</div>
<script>
// Easing (pravidla F1–F4): co přichází ease-out, co odchází ease-in, UI pružina s malým překmitem, nic lineárně.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const usek = (t, od, do_) => clamp((t - od) / (do_ - od));          // 0→1 mezi časy od a do_
const easeOut = (x) => 1 - Math.pow(2, -10 * x);                      // exponenciální příjezd
const easeIn = (x) => (x === 0 ? 0 : Math.pow(2, 10 * x - 10));      // exponenciální odjezd
const easeInOut = (x) => (x < 0.5 ? easeIn(2 * x) / 2 : (1 + easeOut(2 * x - 1)) / 2);
const pruzina = (x, prekmit = 0.08) => {                              // tlumená pružina s daným překmitem (0.08 = 8 %)
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const L = Math.log(prekmit);
  const z = -L / Math.sqrt(Math.PI * Math.PI + L * L);                // útlum odvozený z překmitu
  const w = 5 / z, wd = w * Math.sqrt(1 - z * z);                     // do x = 1 dozní na < 1 %
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
};
const mix = (a, b, x) => a + (b - a) * x;

const $ = (id) => document.getElementById(id);
if (location.search.includes('mrizka')) $('mrizka').style.display = 'block';

window.seek = (t) => {
  // Příklad: titulek přijede zespodu (ease-out) mezi 0,2 a 0,8 s a odjede nahoru (ease-in) mezi 2,4 a 2,9 s.
  const prijezd = easeOut(usek(t, 0.2, 0.8));
  const odjezd = easeIn(usek(t, 2.4, 2.9));
  const y = mix(200, 0, prijezd) + mix(0, -300, odjezd);
  const el = $('titulek');
  el.style.transform = `translateY(${y}px)`;
  el.style.opacity = prijezd * (1 - odjezd);
};
window.seek(0);
</script>
</body>
</html>

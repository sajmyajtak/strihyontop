<!doctype html>
<!-- Výchozí kostra scény pro render_html.cjs. Všechno se počítá z času t ve window.seek(t),
     žádné CSS animace, přechody, časovače ani stav mezi snímky, takže každý snímek jde vyrenderovat přesně a opakovaně.
     ?mrizka v URL zobrazí bezpečné zóny (pravidlo A5): 16:9 okraj 5 %, pro 9:16 přepnout třídu na .svisle. -->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; }
  #svet { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #scena { position: relative; width: 100%; height: 100%; font-family: system-ui, sans-serif; color: #fff; }
  /* Žádné will-change: prvek by se rasterizoval v původní velikosti a při zoomu kamery by text byl rozmazaný. */
  .prvek { position: absolute; }
  /* Bezpečné zóny (A5): 16:9 = text uvnitř 90 % obrazu (okraj 5 %), .svisle = 9:16 (horních 250, spodních 400, pravých 120 px). */
  #mrizka { position: absolute; left: 5%; right: 5%; top: 5%; bottom: 5%; pointer-events: none; display: none;
    outline: 3px dashed rgba(255,0,0,.8); box-shadow: 0 0 0 4000px rgba(255,0,0,.18); }
  #mrizka.svisle { left: 0; right: 120px; top: 250px; bottom: 400px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="smer"><feGaussianBlur id="smerBlur" stdDeviation="0 0"/></filter></svg>
<div id="scena">
  <div id="svet">
    <div class="prvek" id="titulek" style="left:0;right:0;top:45%;text-align:center;font-size:140px;font-weight:800">TITULEK</div>
  </div>
  <div id="mrizka"></div>
</div>
<script>
// ---------- Čas ----------
// Všechny časy událostí na jednom místě (v sekundách nebo v dobách: doba = 60 / BPM).
const BPM = 120, DOBA = 60 / BPM;
const CASY = { prijezd: 0.2, odjezd: 2.4 };
const TEXTY = { titulek: 'TITULEK' };

// ---------- Easing (pravidla F1–F7): příchod ease-out, odchod ease-in, UI pružina s malým překmitem, nic lineárně ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const usek = (t, od, do_) => clamp((t - od) / (do_ - od));          // 0→1 mezi časy od a do_
const easeOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));       // exponenciální příjezd
const easeIn = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));       // exponenciální odjezd
const easeInOut = (x) => (x < 0.5 ? easeIn(2 * x) / 2 : (1 + easeOut(2 * x - 1)) / 2);
const pruzina = (x, prekmit = 0.03) => {                              // UI: tlumená pružina, překmit 2–5 % (F4)
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const L = Math.log(prekmit);
  const z = -L / Math.sqrt(Math.PI * Math.PI + L * L);                // útlum odvozený z překmitu
  const w = 5 / z, wd = w * Math.sqrt(1 - z * z);                     // do x = 1 dozní na < 1 %
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
};
const usazeni = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - (1 + 7 * x) * Math.exp(-7 * x));  // kriticky tlumené, bez překmitu: plochy, kamera, text
const mix = (a, b, x) => a + (b - a) * x;

// Klíčové snímky: kf(t, [[0, 0], [1.2, 100, easeOut], [2, 40, usazeni]]) → hodnota v čase t.
const kf = (t, klice) => {
  if (t <= klice[0][0]) return klice[0][1];
  for (let i = 1; i < klice.length; i++) {
    const [t1, v1, ease = easeInOut] = klice[i], [t0, v0] = klice[i - 1];
    if (t <= t1) return mix(v0, v1, ease(usek(t, t0, t1)));
  }
  return klice[klice.length - 1][1];
};

// Náhoda jen se seedem (mulberry32), aby byl každý render stejný.
const nahoda = (seed) => () => {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
  return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
};

// Kamera: jeden svět, jedna transformace, zoom v logaritmické škále (F7). Volat jednou za snímek.
const kamera = (x, y, logZoom) => {
  $('svet').style.transform = `scale(${Math.exp(logZoom)}) translate(${-x}px, ${-y}px)`;
};

// Směrové rozmazání podle rychlosti (D5): vx, vy v px/s, prvek dostane filter:url(#smer).
// Jeden společný filtr, takže v jednom okamžiku jen pro jeden rychlý prvek (jinak přidat další <filter>).
const rozmazani = (el, vx, vy, sila = 0.012) => {
  const sx = Math.abs(vx) * sila, sy = Math.abs(vy) * sila;
  $('smerBlur').setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);
  el.style.filter = sx + sy > 0.3 ? 'url(#smer)' : 'none';
};

// Desky stopáže (PNG sekvence, 25 fps × 1,2 = 30 fps): index snímku z času ZAOKROUHLENÉHO na výstupní snímek (V005 test, ověřeno).
// Bez zaokrouhlení padá výměna desky přesně na čas výstupního snímku a závěrka (podsnímky ±1/240 s) zprůměruje dva zdrojové snímky,
// na střihu ve stopáži vznikne prolnutý snímek obou záběrů. Stejně kvantovaným časem vybírat i úsek (záběr), grafika běží dál ve spojitém t.
const casDesky = (t, fpsVystup = 60) => Math.round(t * fpsVystup + 1e-6) / fpsVystup;
const snimekDesky = (t, od, fpsDesky = 30, fpsVystup = 60) => Math.max(0, Math.floor((casDesky(t, fpsVystup) - od) * fpsDesky + 1e-6));

// Rozostření desky bez ctx.filter (výkon): prolne dvě nejbližší předpočítané úrovně σ (soubory klic_b3, klic_b9 …) (V005 test, ověřeno).
// Při kreslení se zvětšením s je efektivní rozostření σ · s (nájezd 1 → 5 s σ 9 = 45 px).
const kresliRozostreni = (ctx, obr, klic, urovne, sigma, alfa = 1) => {
  let lo = 0, hi = 0;
  for (const u of urovne) if (u <= sigma) lo = u;
  for (const u of [...urovne].reverse()) if (u >= sigma) hi = u;
  ctx.globalAlpha = alfa; ctx.drawImage(obr[lo ? `${klic}_b${lo}` : klic], 0, 0);
  if (hi !== lo) { ctx.globalAlpha = alfa * usek(sigma, lo, hi); ctx.drawImage(obr[`${klic}_b${hi}`], 0, 0); }
  ctx.globalAlpha = 1;
};


// Wipe pruhy s rozmazáním pohybem po řádcích (V005, ověřeno výřezem s podsnímky): barvaRadku(t, y) → [r, g, b] nebo null.
// Rychlé pruhy (≥ 60 px/snímek) by podsnímky rendereru rozložily na schodovité kopie (C003); tady se 24 vzorků přes závěrku 1/120 s
// zprůměruje analyticky do pruhu 1 × H px a roztáhne na šířku. Pruhy jsou čitelné, když hrana zpomaluje (příjezd ease-out, odjezd ease-in).
let _wipeC = null;
const wipePruhy = (g, t, barvaRadku, W = 1920, H = 1080, N = 24) => {
  if (!_wipeC) { _wipeC = document.createElement('canvas'); _wipeC.width = 1; _wipeC.height = H; }
  const q = _wipeC.getContext('2d'), d = q.createImageData(1, H);
  for (let y = 0; y < H; y++) {
    let r = 0, gg = 0, b = 0, n = 0;
    for (let k = 0; k < N; k++) { const c = barvaRadku(t + ((k + 0.5) / N - 0.5) / 120, y + 0.5); if (c) { r += c[0]; gg += c[1]; b += c[2]; n++; } }
    if (n) { d.data[4 * y] = r / n; d.data[4 * y + 1] = gg / n; d.data[4 * y + 2] = b / n; d.data[4 * y + 3] = 255 * n / N; }
  }
  q.putImageData(d, 0, 0); g.save(); g.imageSmoothingEnabled = false; g.drawImage(_wipeC, 0, 0, 1, H, 0, 0, W, H); g.restore();
};
// Kruhová clona (V005): nový obraz (kresliNovy(ctx)) v kruhu r se středem cx, cy; měkký okraj 8 px + rozmazání hrany podle rychlosti vr (px/s).
let _clonaC = null;
const clonaKruh = (g, kresliNovy, cx, cy, r, vr = 0, W = 1920, H = 1080) => {
  if (r < 1) return;
  if (!_clonaC) { _clonaC = document.createElement('canvas'); _clonaC.width = W; _clonaC.height = H; }
  const o = _clonaC.getContext('2d'); o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.clearRect(0, 0, W, H);
  kresliNovy(o);
  const pero = 8 + vr / 240, gr = o.createRadialGradient(cx, cy, Math.max(0, r - pero), cx, cy, r + pero);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  o.globalCompositeOperation = 'destination-in'; o.fillStyle = gr; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
  g.drawImage(_clonaC, 0, 0);
};

const $ = (id) => document.getElementById(id);
if (location.search.includes('mrizka')) $('mrizka').style.display = 'block';

// ---------- Scéna ----------
const poloha = (t) => kf(t, [[CASY.prijezd, 200], [CASY.prijezd + 0.6, 0, easeOut], [CASY.odjezd, 0], [CASY.odjezd + 0.5, -300, easeIn]]);

const seek = (t) => {
  const el = $('titulek');
  el.textContent = TEXTY.titulek;
  const y = poloha(t);
  el.style.transform = `translateY(${y}px)`;
  el.style.opacity = easeOut(usek(t, CASY.prijezd, CASY.prijezd + 0.6)) * (1 - easeIn(usek(t, CASY.odjezd, CASY.odjezd + 0.5)));
  rozmazani(el, 0, (poloha(t + 1 / 120) - poloha(t - 1 / 120)) * 60);   // rychlost z rozdílu polohy
  kamera(0, 0, Math.log(mix(1, 1.04, usek(t, 0, 3))));                 // pomalé dotlačení 1,00 → 1,04
};

// Scénu stavět a měřit až po načtení fontů. Renderer na window.seek čeká, takže se definuje až potom.
// document.fonts.ready nečeká na fonty, které ještě nepoužil žádný prvek (C016): každý řez se proto vynutí přes fonts.load.
const FONTY = [];   // např. ['200 150px "Big Shoulders Display"', '900 150px "Big Shoulders Display"']
Promise.all(FONTY.map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => {
    window.seek = seek;
    seek(0);
  });
</script>
</body>
</html>
